[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline-runner"
version = "0.1.0"
description = "🚀 YAML Pipeline Runner — Define and execute CI/CD pipelines from YAML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zenith Pipeline Runner" }]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
pipeline-runner = "pipeline_runner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
