# ── Science Research Engine ──────────────────────────────────
- token: "ACT:SCIENCE_RESEARCH"
  patterns: ["\\bresearch\\b", "\\bscience\\b", "\\bstudy\\b", "\\binvestigate\\b", "\\bhypothesis\\b"]
  target: system
  description: "Science research with Socratic rebuttal. Auto-detects domain (new_energy, pharma, cross_domain). Checks claims against physics laws and literature. params: {query, depth? (normal|deep)}"
  params_schema:
    query: "string"
    depth: "string"
  risk_level: low

- token: "ACT:ANALYZE_MOLECULE"
  patterns: ["\\banalyze molecule\\b", "\\bsmiles\\b", "\\bdrug likeness\\b", "\\blipinski\\b"]
  target: system
  description: "Analyze molecule drug-likeness using RDKit. Returns MW, LogP, HBD, HBA, TPSA, Lipinski Ro5. params: {smiles}"
  params_schema:
    smiles: "string"
  risk_level: low

- token: "ACT:CHECK_BATTERY_CLAIM"
  patterns: ["\\bbattery claim\\b", "\\benergy density\\b", "\\bwh/kg\\b"]
  target: system
  description: "Validate battery energy density claim against theoretical limits. params: {material, energy_density}"
  params_schema:
    material: "string"
    energy_density: "number"
  risk_level: low

- token: "ACT:CHECK_FUSION_LAWSON"
  patterns: ["\\bfusion\\b", "\\blawson\\b", "\\bignition\\b", "\\bplasma\\b"]
  target: system
  description: "Check if fusion conditions meet Lawson criterion. params: {density_m3, confinement_s, temperature_kev}"
  params_schema:
    density_m3: "number"
    confinement_s: "number"
    temperature_kev: "number"
  risk_level: low

- token: "ACT:COMPUTE_DEBYE_LENGTH"
  patterns: ["\\bdebye\\b", "\\belectrolyte\\b", "\\bscreening\\b"]
  target: system
  description: "Compute Debye length for electrolyte screening. params: {temperature_k, concentration_mol_L, charge_number?}"
  params_schema:
    temperature_k: "number"
    concentration_mol_L: "number"
    charge_number: "number"
  risk_level: low
